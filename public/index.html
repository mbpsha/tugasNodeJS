<!-- === public/index.html === -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Node.js + Vue</title>
    <!-- Mengimpor Vue 3 dari CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { border: 1px solid #ccc; padding: 20px; max-width: 300px; border-radius: 8px; }
        input { display: block; width: 90%; margin-bottom: 10px; padding: 8px; }
        button { padding: 8px 15px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="app">
        <!-- ================= HALAMAN LOGIN ================= -->
        <div v-if="halamanAktif === 'login'" class="container">
            <h2>Login</h2>
            <form @submit.prevent="prosesLogin">
                <input type="text" v-model="formLogin.username" placeholder="Username" required>
                <input type="password" v-model="formLogin.password" placeholder="Password" required>
                <button type="submit">Masuk</button>
            </form>
            <p>Belum punya akun? <a href="#" @click.prevent="gantiHalaman('register')">Daftar</a></p>
        </div>

        <!-- ================= HALAMAN REGISTER ================= -->
        <div v-if="halamanAktif === 'register'" class="container">
            <h2>Register</h2>
            <form @submit.prevent="prosesRegister">
                <input type="text" v-model="formRegister.username" placeholder="Buat Username" required>
                <input type="password" v-model="formRegister.password" placeholder="Buat Password" required>
                <button type="submit">Daftar</button>
            </form>
            <p>Sudah punya akun? <a href="#" @click.prevent="gantiHalaman('login')">Login</a></p>
        </div>

        <!-- ================= LANDING PAGE ================= -->
        <div v-if="halamanAktif === 'landing'" class="container" style="max-width: 400px; border-color: green;">
            <h2 style="color: green;">Selamat Datang, {{ userAktif }}!</h2>
            <p>Ini adalah landing page Vue.js yang mengambil data dari Node.js Backend.</p>
            <button @click="prosesLogout">Logout</button>
        </div>
    </div>

    <!-- === LOGIKA VUE.JS === -->
    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                // State Management
                const halamanAktif = ref('login'); // Default halaman
                const userAktif = ref('');

                // Data Form
                const formLogin = ref({ username: '', password: '' });
                const formRegister = ref({ username: '', password: '' });

                // Cek sesi saat aplikasi dimuat
                onMounted(() => {
                    const sesiSavelocal = localStorage.getItem('userSession');
                    if (sesiSavelocal) {
                        userAktif.value = sesiSavelocal;
                        halamanAktif.value = 'landing';
                    }
                });

                // Fungsi Pindah Halaman
                const gantiHalaman = (halaman) => {
                    halamanAktif.value = halaman;
                };

                // Fungsi Register (Fetch ke Backend Node.js)
                const prosesRegister = async () => {
                    const response = await fetch('/api/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formRegister.value)
                    });
                    const data = await response.json();
                    alert(data.message);

                    if (response.ok) {
                        formRegister.value = { username: '', password: '' }; // Reset form
                        halamanAktif.value = 'login'; // Arahkan ke login
                    }
                };

                // Fungsi Login (Fetch ke Backend Node.js)
                const prosesLogin = async () => {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formLogin.value)
                    });
                    const data = await response.json();

                    if (response.ok) {
                        alert(data.message);
                        localStorage.setItem('userSession', data.username); // Simpan sesi
                        userAktif.value = data.username;
                        formLogin.value = { username: '', password: '' }; // Reset form
                        halamanAktif.value = 'landing'; // Masuk ke landing page
                    } else {
                        alert(data.message); // Jika gagal
                    }
                };

                // Fungsi Logout
                const prosesLogout = () => {
                    localStorage.removeItem('userSession');
                    userAktif.value = '';
                    halamanAktif.value = 'login';
                };

                return {
                    halamanAktif, userAktif, formLogin, formRegister,
                    gantiHalaman, prosesRegister, prosesLogin, prosesLogout
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
